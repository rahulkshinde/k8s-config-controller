# This rule is not used by the project k8s-config-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to config.rahulkshinde.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: configrollback-viewer-role
rules:
- apiGroups:
  - config.rahulkshinde.dev
  resources:
  - configrollbacks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - config.rahulkshinde.dev
  resources:
  - configrollbacks/status
  verbs:
  - get
