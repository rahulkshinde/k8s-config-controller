# This rule is not used by the project k8s-config-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the config.rahulkshinde.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-config-controller
    app.kubernetes.io/managed-by: kustomize
  name: configrollback-editor-role
rules:
- apiGroups:
  - config.rahulkshinde.dev
  resources:
  - configrollbacks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.rahulkshinde.dev
  resources:
  - configrollbacks/status
  verbs:
  - get
